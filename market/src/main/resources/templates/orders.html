<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Заказы</title>
</head>

<body>
<a href="/logout" style="float:right;"><b>ВЫЙТИ &cudarrr;</b></a>
<a href="/cart" style="float:right;"><b>КОРЗИНА &cudarrr;</b></a>
<a href="/" style="float:right;"><b>ГЛАВНАЯ &cudarrr;</b></a>
<table style="width:70%;margin-left:auto;margin-right:auto;">
    <tr th:each="order : ${orders}">
        <h2>
            <a th:text="'Заказ №' + ${order.getId()}" th:href="@{'/orders/' + ${order.getId()}}"></a>
        </h2>
        <table>
            <tr th:each="item : ${order.getItemList()}">
                <td th:text="${item.getName()+' ('+item.getQuantity()+' шт.) '+(item.getPrice()*item.getQuantity())+' руб.'}"></td>
            </tr>
        </table>
        <p><b th:text="'Сумма: ' + ${order.getTotalAmount()} + ' руб.'"></b></p>
    </tr>
</table>
</body>
</html>
