server:
  port: 8080

spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  webflux:
    charset: UTF-8
  thymeleaf:
    encoding: UTF-8
    servlet:
      content-type: text/html;charset=UTF-8
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/postgres
    #url: jdbc:postgresql://host.docker.internal:5432/postgres
    username: postgres
    password: postgres
    pool:
      enabled: true                               # Включение пула соединений
      initial-size: 10                            # Начальное количество соединений в пуле
      max-size: 50                                # Максимальное количество соединений
      max-idle-time: 30s                          # Время бездействия соединения перед закрытием
      max-life-time: 10m                          # Максимальное время жизни соединения
      validation-query: SELECT 1

  flyway:
    url: jdbc:postgresql://localhost:5432/postgres
    enabled: true
    locations: classpath:db/migration
    table: schema_version
    sql-migration-prefix: V
    sql-migration-separator: __
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8083/realms/master # Адрес сервера авторизации для получения токена
        registration:
          yandex: # Описание клиента OAuth2
            provider: keycloak
            authorizationGrantType: client_credentials
            client-id: market # Клиент созданный в keycloak
            client-secret: V7jq2PK22Dnki3orqPXH8ADGjPEp02As # Секрет полученный из keycloak
            scope: profile
            clientAuthenticationMethod: client_secret_post # Способ передачи секрета
redis:
  ttl: 5